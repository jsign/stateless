[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/paradigmxyz/stateless"
repository = "https://github.com/paradigmxyz/stateless"
exclude = [".github/"]

[workspace]
members = ["crates/stateless", "testing/ef-tests", "testing/runner"]
resolver = "2"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.rustdoc]
all = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
debug = "none"
strip = "symbols"

[workspace.dependencies]
# internal
stateless = { path = "crates/stateless" }

# reth
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-2", default-features = false }
reth-consensus = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-2", default-features = false }
reth-db = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-2" }
reth-db-api = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-2" }
reth-db-common = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-2" }
reth-ethereum-consensus = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-2", default-features = false }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-2", default-features = false }
reth-evm = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-2", default-features = false }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-2" }
reth-primitives-traits = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-2", default-features = false }
reth-provider = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-2" }
reth-revm = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-2", default-features = false }
reth-tracing = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-2" }
reth-trie = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-2" }
reth-trie-common = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-2", default-features = false }
reth-trie-db = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-2" }
reth-trie-sparse = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-2", default-features = false }
reth-errors = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-2", default-features = false }

# alloy
alloy-consensus = { version = "1.7.3", default-features = false }
alloy-eips = { version = "1.7.3", default-features = false }
alloy-genesis = { version = "1.7.3", default-features = false }
alloy-primitives = { version = "1.5", default-features = false }
alloy-rlp = { version = "0.3", default-features = false }
alloy-rpc-types-debug = { version = "1.7.3", default-features = false }
alloy-trie = { version = "0.9", default-features = false }
alloy-evm = { version = "0.27", default-features = false }
alloy-eip7928 = { version = "0.3.0", default-features = false, features = [
    "rlp",
] }

# revm
revm = { version = "34.0.0", default-features = false }
revm-bytecode = { version = "8.0.0", default-features = false }
revm-database-interface = { version = "9.0.0", default-features = false }
revm-state = { version = "9.0.0", default-features = false }

# misc
itertools = { version = "0.14", default-features = false, features = [
    "use_alloc",
] }
rayon = "1.8"
serde = { version = "1.0", default-features = false, features = [
    "derive",
    "alloc",
] }
serde_json = "1.0"
serde_with = { version = "3.16", default-features = false, features = [
    "alloc",
] }
thiserror = { version = "2.0", default-features = false }
walkdir = "2.5"

clap = "4"
flate2 = "1"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
tar = "0.4"
tempfile = "3"

[patch.crates-io]
# revm staging patches
revm = { git = "https://github.com/bluealloy/revm", branch = "main" }
revm-bytecode = { git = "https://github.com/bluealloy/revm", branch = "main" }
revm-database = { git = "https://github.com/bluealloy/revm", branch = "main" }
revm-database-interface = { git = "https://github.com/bluealloy/revm", branch = "main" }
revm-state = { git = "https://github.com/bluealloy/revm", branch = "main" }
revm-primitives = { git = "https://github.com/bluealloy/revm", branch = "main" }
revm-interpreter = { git = "https://github.com/bluealloy/revm", branch = "main" }
revm-precompile = { git = "https://github.com/bluealloy/revm", branch = "main" }
revm-context = { git = "https://github.com/bluealloy/revm", branch = "main" }
revm-context-interface = { git = "https://github.com/bluealloy/revm", branch = "main" }
revm-handler = { git = "https://github.com/bluealloy/revm", branch = "main" }
revm-inspector = { git = "https://github.com/bluealloy/revm", branch = "main" }
op-revm = { git = "https://github.com/bluealloy/revm", branch = "main" }

# alloy-evm bal-devnet2 patches
alloy-evm = { git = "https://github.com/alloy-rs/evm", branch = "bal-devnet2" }

# alloy bal-devnet2 patches
alloy-consensus = { git = "https://github.com/alloy-rs/alloy", branch = "bal-devnet2" }
alloy-consensus-any = { git = "https://github.com/alloy-rs/alloy", branch = "bal-devnet2" }
alloy-eips = { git = "https://github.com/alloy-rs/alloy", branch = "bal-devnet2" }
alloy-genesis = { git = "https://github.com/alloy-rs/alloy", branch = "bal-devnet2" }
alloy-network = { git = "https://github.com/alloy-rs/alloy", branch = "bal-devnet2" }
alloy-network-primitives = { git = "https://github.com/alloy-rs/alloy", branch = "bal-devnet2" }
alloy-rpc-types-debug = { git = "https://github.com/alloy-rs/alloy", branch = "bal-devnet2" }
alloy-rpc-types-engine = { git = "https://github.com/alloy-rs/alloy", branch = "bal-devnet2" }
alloy-rpc-types-eth = { git = "https://github.com/alloy-rs/alloy", branch = "bal-devnet2" }
alloy-serde = { git = "https://github.com/alloy-rs/alloy", branch = "bal-devnet2" }
alloy-signer = { git = "https://github.com/alloy-rs/alloy", branch = "bal-devnet2" }
alloy-transport = { git = "https://github.com/alloy-rs/alloy", branch = "bal-devnet2" }
alloy-tx-macros = { git = "https://github.com/alloy-rs/alloy", branch = "bal-devnet2" }
